<!doctype html><html lang="fi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b55"><link rel="manifest" href="./manifest.webmanifest"><title>Kauppalista</title><style>body{font:16px system-ui;background:#f4f7f5;color:#172b24;margin:0}main{max-width:650px;margin:auto;padding:20px}button,input,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #cbd6d0}button{background:#176b55;color:white;border:0;cursor:pointer}.secondary{background:#e2eee8;color:#174d3e}.card{background:white;padding:17px;border-radius:16px;margin:14px 0;box-shadow:0 2px 8px #10251a0d}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row input{min-width:0;flex:1}.item{display:flex;align-items:center;gap:10px;border-bottom:1px solid #edf0ee;padding:12px 0}.item label{flex:1;overflow-wrap:anywhere}.item.done label{text-decoration:line-through;color:#829188}.item input{width:22px;height:22px;accent-color:#176b55}.item small{color:#617268}.item button{padding:8px;background:#f5e7e7;color:#913b3b}#status{font-size:13px;color:#526a5e}#lists{flex:1;min-width:140px}footer{font-size:12px;color:#657b70;text-align:center}</style></head><body><main><h1>🛒 Kauppalista</h1><div id="status">Valmistellaan…</div><section class="card"><div class="row"><select id="lists" aria-label="Valitse lista"></select><button id="new" class="secondary">+ Lista</button></div><p class="row"><button id="share" class="secondary">Jaa lista</button><button id="reset" class="secondary">Tyhjennä ostetut</button></p></section><section class="card"><form id="add" class="row"><input id="product" required maxlength="120" placeholder="Lisää tuote" aria-label="Tuote"><input id="quantity" maxlength="40" style="flex:0 0 85px;width:85px" placeholder="Määrä" aria-label="Määrä"><button>+</button></form><div id="items"></div><p id="count"></p></section><footer>Toimii myös puhelimeen asennettuna • Muutokset synkronoidaan automaattisesti</footer></main><script src="./app.js"></script></body></html>
